baseURL: https://physik.erikskopp.de/
locale: de-DE
defaultContentLanguage: de
title: Technische Physik
enableGitInfo: true
enableRobotsTXT: true

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
            - ['$', '$']

menu:
  main:
    - name: Dokumentation
      pageRef: /
      weight: 1
    - name: Suche
      weight: 2
      params:
        type: search
    - name: GitHub
      weight: 3
      url: https://github.com/eskopp/Physik
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: logo.svg
      dark: logo.svg
      width: 28
      height: 28
  page:
    width: normal
  displayUpdatedDate: true
  editURL:
    enable: true
    base: https://github.com/eskopp/Physik/edit/main/content
  search:
    enable: true
    type: flexsearch
  math:
    engine: katex
